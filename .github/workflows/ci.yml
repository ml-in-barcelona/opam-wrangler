name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the pinned workerd version
        id: workerd
        run: echo "version=$(sed -n 's/.*"workerd" {= "\([^"]*\)"}.*/\1/p' wrangler.opam)" >> "$GITHUB_OUTPUT"

      - uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: 5.4.0
          pins: workerd.${{ steps.workerd.outputs.version }} git+https://github.com/ml-in-barcelona/opam-workerd.git#${{ steps.workerd.outputs.version }}
          extra-packages: dune-release

      - uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: wrangler

      - name: Install wrangler
        run: opam install ./wrangler.opam --assume-depexts -y

      - name: Run wrangler
        run: opam exec -- wrangler --version

      - name: Bundle a Worker
        run: |
          mkdir worker
          echo 'export default { fetch: () => new Response("ok") };' > worker/index.js
          cd worker && opam exec -- wrangler deploy --dry-run --name test --compatibility-date 2026-01-01 index.js
