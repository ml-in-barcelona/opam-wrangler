name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - run: opam install dune-release -y

      - uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: wrangler

      - name: Install workerd and wrangler
        run: |
          workerd=$(sed -n 's/.*"workerd" {= "\([^"]*\)"}.*/\1/p' wrangler.opam)
          opam pin add -n -y "workerd.$workerd" "git+https://github.com/ml-in-barcelona/opam-workerd.git#$workerd"
          opam install ./wrangler.opam --assume-depexts -y

      - name: Run wrangler
        run: opam exec -- wrangler --version

      - name: Bundle a Worker
        run: |
          mkdir worker
          echo 'export default { fetch: () => new Response("ok") };' > worker/index.js
          cd worker && opam exec -- wrangler deploy --dry-run --name test --compatibility-date 2026-01-01 index.js

      - name: Check the scripts
        working-directory: scripts
        run: |
          npm ci
          npm run check
